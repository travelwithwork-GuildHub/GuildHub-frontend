# 這是**唯一真正擋得住東西的一層**。本地沒有任何 hook。
#
# ⚠️ 但要知道它的邊界：GitHub 在 `pull_request` 事件跑的是 **PR 分支上的**
# 這個檔案。所以在 PR 裡把下面任何一步改成 `run: true`，CI 照樣綠 ——
# 而且那個綠燈來源完全合法，required check 的 integration_id 綁定擋不住。
#
# 能機械封住它的是 ruleset 的「Require workflows to pass」（workflow 檔從
# main 的 ref 取，不從 PR 分支取），但那要 org ruleset + Team/Enterprise 方案，
# 這個 org 是 free。**所以改這個檔案唯一的防線是 CODEOWNERS + 第二個人的 review。**
# 不要以為 CI 保護得了 CI。

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # job 名稱就是 required check 的名稱。
  # ruleset 把它綁定到 integration_id 15368（GitHub Actions）——
  # 那只擋「外部拿 write token 直接 POST 一個假的 ci: success」，
  # 不保護這個檔案的內容。改名字要同步改 ruleset 設定。
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # 分支類別閘門。取代舊的 check-pr-phase.sh。
      #
      # 舊版用路徑 allow-list 判斷「什麼是產品程式碼」，而 allow-list
      # 沒列到的路徑是 fail-OPEN。實測過：只有 `src/a.ts`、沒有任何
      # openspec 檔案的 PR 會整個通過。
      #
      # 這一版看分支前綴（封閉列舉），每一類綁一個不看檔案性質的上界。
      - name: Branch
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-pr-branch.sh "${{ github.base_ref }}" "${{ github.head_ref }}"

      - run: npm ci

      # lockfile 的來源檢查。
      #
      # 為什麼需要：chore/ 的大小上界**刻意排除 package-lock.json**
      # （它是機器產生的，人不讀它，算進去的話任何套件更新都會被擋）。
      # 那個排除留下一個洞 —— 一個很小的 package.json diff 可以搭配
      # 一個把 `resolved` 指向非 registry host 的巨大 lockfile 改動。
      #
      # 這一關補那個洞：驗每一筆 resolved 都指向 npm registry、走 https、
      # 有 integrity。它不看大小，也不管 package.json 有沒有動 ——
      # 所以 `npm audit fix` 這種只動 lockfile 的安全修補不會被誤擋。
      #
      # （lockfile 與 package.json 是否一致，上面的 `npm ci` 已經免費驗了 ——
      # 不一致會直接報錯。所以這裡不必再做一次。）
      - name: Lockfile
        run: npx lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      # 規格結構檢查。
      #
      # `npx openspec` 不帶套件名，解析到的是 node_modules/.bin/openspec ——
      # 也就是 package-lock.json 鎖住的那個版本。**不要寫成
      # `npx @fission-ai/openspec@x.y.z`**，那會去抓網路上的版本，
      # 就繞過了 lockfile，等於沒鎖。
      #
      # `--strict` 會抓沒有 Scenario 的 requirement、沒有 delta 的 change、
      # 太短的 Purpose。最後一項只有在 archive 之後才會對 main spec 生效，
      # 所以 archive/ 分支的閘門會額外再跑一次 —— 讓它在 PR 上就紅，
      # 而不是合併後 main 才爆。
      - name: Spec
        run: npx openspec validate --all --strict

      # 工作分解表自己訂的規則。
      #
      # 為什麼它在 CI 而 check-ruleset.sh 不在：這一支**不需要任何額外權限**，
      # 只讀 repo 裡的檔案；ruleset 那支要 administration:read，為它擴大
      # CI 的權限面不划算。判準是權限，不是重要性。
      #
      # 驗的是：標記要附理由、互斥的處置不得並存、缺口要有決策期限與
      # fallback、**工作的週次必須嚴格晚於它依賴的裁決期限**、依賴不得懸空、
      # 第一欄不是合法 ID 不得被當成續行。
      #
      # 加它的證據（依〈新增流程閘門的門檻〉，要有可重現的繞法）：
      # 第一次跑就抓到 42 條真實違規；而且上面每一條都有負向測試
      # （`test-progress-check.sh`），實測過在修好之前**全部靜默通過**。
      - name: WBS
        run: bash .github/scripts/progress.sh --check

      # 上面那支閘門自己的測試。**閘門壞掉的方式是安靜的** ——
      # 不會有東西變紅，只會有本來該紅的東西變綠。
      - name: WBS gate tests
        run: bash .github/scripts/test-progress-check.sh

      # ⚠️ Lint / Typecheck / Test / Build 暫時移除。
      #
      # 這個 repo 還沒有任何程式碼，package.json 那四個 script 是刻意會失敗的佔位。
      # 留著它們，CI 會永遠是紅的 —— 而永遠紅的 CI 等於沒有 CI，
      # 團隊很快就會開始無視紅燈。
      #
      # W1（FE-C01）建立 Next.js 專案並設好四個 script 之後，把下面這段加回來。
      # **那必須是一個 governance/ 分支的獨立 PR**（它改的是 .github/），
      # 而且要緊接在 scaffold PR 之後，不要留下一個沒有工程品質閘門的窗口：
      #
      #   - name: Lint
      #     run: npm run lint
      #
      #   - name: Typecheck
      #     run: npm run typecheck
      #
      #   - name: Test
      #     run: npm test
      #
      #   - name: Build
      #     run: npm run build
      #
      # 每一關獨立列出，不要串成一行 —— 串起來看 log 分不出是哪一關紅的。
