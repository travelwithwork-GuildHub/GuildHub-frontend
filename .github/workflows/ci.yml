# 這是**唯一真正擋得住東西的一層**。本地沒有任何 hook。
#
# ⚠️ 但要知道它的邊界：GitHub 在 `pull_request` 事件跑的是 **PR 分支上的**
# 這個檔案。所以在 PR 裡把下面任何一步改成 `run: true`，CI 照樣綠 ——
# 而且那個綠燈來源完全合法，required check 的 integration_id 綁定擋不住。
#
# 能機械封住它的是 ruleset 的「Require workflows to pass」（workflow 檔從
# main 的 ref 取，不從 PR 分支取），但那要 org ruleset + Team/Enterprise 方案，
# 這個 org 是 free。**所以改這個檔案唯一的防線是 CODEOWNERS + 第二個人的 review。**
# 不要以為 CI 保護得了 CI。

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # job 名稱就是 required check 的名稱。
  # ruleset 把它綁定到 integration_id 15368（GitHub Actions）——
  # 那只擋「外部拿 write token 直接 POST 一個假的 ci: success」，
  # 不保護這個檔案的內容。改名字要同步改 ruleset 設定。
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # 分支類別閘門。取代舊的 check-pr-phase.sh。
      #
      # 舊版用路徑 allow-list 判斷「什麼是產品程式碼」，而 allow-list
      # 沒列到的路徑是 fail-OPEN。實測過：只有 `src/a.ts`、沒有任何
      # openspec 檔案的 PR 會整個通過。
      #
      # 這一版看分支前綴（封閉列舉），每一類綁一個不看檔案性質的上界。
      # `npm ci` 要排在 Branch 之前。看起來多裝一次，但 Branch 那一關內部會跑
      # `npx openspec validate`（check-pr-branch.sh 的 spec/ 與 archive/ 分支），
      # 沒有 node_modules 的話那次 npx 會去抓網路上的版本 —— **繞過 lockfile**。
      # 正確性優先於快速失敗。
      - run: npm ci

      # 🔒 分支名**一定要走 env 中介變數**，不可以把 `${{ github.head_ref }}`
      # 直接插進 `run:`。Actions 是**文字替換**，而 git 收 `chore/$(...)` 這種
      # 分支名（`git check-ref-format` rc=0）—— 直接插值的話那段會在閘門拿到
      # 參數之前就被 shell 執行。這是 GitHub 官方點名的 script injection。
      # `.github/scripts/test-ci-workflow.sh` 在驗這件事，改這一步之前先跑它。
      # **驗證用的暫時步驟**：證明 actionlint 抓得到底下故意種回去的注入洞。
      - name: actionlint
        uses: raven-actions/actionlint@v2

      - name: Branch
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-pr-branch.sh "${{ github.base_ref }}" "${{ github.head_ref }}"

      # lockfile 的來源檢查。
      #
      # 為什麼需要：chore/ 的大小上界**刻意排除 package-lock.json**
      # （它是機器產生的，人不讀它，算進去的話任何套件更新都會被擋）。
      # 那個排除留下一個洞 —— 一個很小的 package.json diff 可以搭配
      # 一個把 `resolved` 指向非 registry host 的巨大 lockfile 改動。
      #
      # 這一關補那個洞：驗每一筆 resolved 都指向 npm registry、走 https、
      # 有 integrity。它不看大小，也不管 package.json 有沒有動 ——
      # 所以 `npm audit fix` 這種只動 lockfile 的安全修補不會被誤擋。
      #
      # （lockfile 與 package.json 是否一致，上面的 `npm ci` 已經免費驗了 ——
      # 不一致會直接報錯。所以這裡不必再做一次。）
      - name: Lockfile
        run: npx lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      # 規格結構檢查。
      #
      # `npx openspec` 不帶套件名，解析到的是 node_modules/.bin/openspec ——
      # 也就是 package-lock.json 鎖住的那個版本。**不要寫成
      # `npx @fission-ai/openspec@x.y.z`**，那會去抓網路上的版本，
      # 就繞過了 lockfile，等於沒鎖。
      #
      # `--strict` 會抓沒有 Scenario 的 requirement、沒有 delta 的 change、
      # 太短的 Purpose。最後一項只有在 archive 之後才會對 main spec 生效，
      # 所以 archive/ 分支的閘門會額外再跑一次 —— 讓它在 PR 上就紅，
      # 而不是合併後 main 才爆。
      - name: Spec
        run: npx openspec validate --all --strict

      # 工作分解表自己訂的規則。
      #
      # 為什麼它在 CI 而 check-ruleset.sh 不在：這一支**不需要任何額外權限**，
      # 只讀 repo 裡的檔案；ruleset 那支要 administration:read，為它擴大
      # CI 的權限面不划算。判準是權限，不是重要性。
      #
      # 驗的是：標記要附理由、互斥的處置不得並存、缺口要有決策期限與
      # fallback、**工作的週次必須嚴格晚於它依賴的裁決期限**、依賴不得懸空、
      # 第一欄不是合法 ID 不得被當成續行。
      #
      # 加它的證據（依〈新增流程閘門的門檻〉，要有可重現的繞法）：
      # 第一次跑就抓到 42 條真實違規；而且上面每一條都有負向測試
      # （`test-progress-check.sh`），實測過在修好之前**全部靜默通過**。
      - name: WBS
        run: bash .github/scripts/progress.sh --check

      # 上面那支閘門自己的測試。**閘門壞掉的方式是安靜的** ——
      # 不會有東西變紅，只會有本來該紅的東西變綠。
      - name: WBS gate tests
        run: bash .github/scripts/test-progress-check.sh

      # 分支閘門自己的測試。**它之前不在 CI 裡** —— 有測試、沒有讀者。
      # 排在 npm ci 之後：這支內部會跑 `npx openspec archive`。
      - name: Branch gate tests
        run: bash .github/scripts/test-check-pr-branch.sh

      # workflow 自己的合約測試：分支名有沒有原樣傳進閘門。
      - name: Workflow contract tests
        run: bash .github/scripts/test-ci-workflow.sh

      # 提示檔自己的合約測試：文件教的操作，閘門收不收得下。
      - name: Prompts contract tests
        run: bash .github/scripts/test-prompts.sh

      - name: Scenario coverage gate tests
        run: bash .github/scripts/test-scenario-coverage.sh

      # ─── 工程品質。2026-09-07 由 FE-O10 放回（governance/ci-quality-steps）───
      #
      # 為什麼曾經被拿掉：這個 repo 建立之初沒有任何程式碼，package.json 那四個
      # script 是刻意會失敗的佔位。留著它們 CI 會永遠是紅的 ——
      # 而永遠紅的 CI 等於沒有 CI，團隊很快就會開始無視紅燈。
      #
      # 為什麼現在放回來：FE-X01 的 scaffold（#29）已經把四個 script 換成真的指令，
      # 乾淨 checkout ＋ npm ci 驗過四個都 rc=0。**放回來的那一刻起，
      # 前一個 PR 的綠燈不再只代表「治理閘門過了」。**
      #
      # 為什麼排在治理閘門之後：分支類別、lockfile、規格結構、工作分解表這幾關
      # 各自只要幾秒，而且判定的是「這個 PR 在流程上成不成立」。
      # 分支名不合法的 PR 無論程式碼多好都會被拒 —— 沒有理由先花一分鐘 build 它。
      # 便宜的、結構性的檢查先跑；貴的、需要編譯的最後跑。
      #
      # 上面的 Branch 那一關有 `if: github.event_name == 'pull_request'`，
      # 所以直接 push 到 main 時它會被跳過，而下面這四關照跑 —— 排在最後是安全的。
      #
      # 每一關獨立列出，不要串成一行 —— 串起來看 log 分不出是哪一關紅的。
      #
      # 還沒做、但已知的事：`.next/cache` 沒有被 actions/cache 快取，所以每次
      # build 都是冷啟動。現在 build 只要幾秒，離 timeout-minutes: 15 很遠，
      # 所以不在這個 PR 處理 —— 它跟「把四關放回去」是兩件事。

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # **每一條 Scenario 都要有一個真的跑過而且通過的測試指著它。**
      # 排在 Test 之後 —— 它自己會再跑一次 vitest（要 JSON 報告），
      # 但先讓 Test 那一步給出一般人看得懂的輸出。
      - name: Scenario coverage
        run: bash .github/scripts/check-scenario-coverage.sh

      # NEXT_TELEMETRY_DISABLED：CI 不對外回報建置遙測。
      # 這不是效能考量，是「CI 不該在沒有人要求的情況下把資料送出去」。
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
