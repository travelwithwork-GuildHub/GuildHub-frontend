# Gemini 自動審查 PR。
#
# **這一關目前是 advisory，不是 required check。** 它會留下 review 意見，
# 但不會擋合併 —— 人看過意見再決定。理由見本檔最後。
#
# 需要 repo secret `GEMINI_API_KEY`（https://aistudio.google.com/apikey）。
# 沒設的話這個 workflow 會跳過並留下 notice，不會變成紅燈噪音。

name: Gemini Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: gemini-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
      # Gemini CLI 預設會拒絕在「不受信任的資料夾」執行。
      # CI runner 每次都是全新的一次性容器，checkout 出來的就是要審的東西，
      # 所以在這裡信任它是安全的。
      # 沒有這一行的實際錯誤：
      #   Gemini CLI is not running in a trusted directory.
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # fail-open 的處理：沒有 key 時**明確標示「沒有審查」**，
      # 而不是靜默通過 —— 否則分不出「審過沒問題」和「根本沒審」。
      - name: 沒有 API key
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning title=未執行 Gemini 審查::沒有設定 GEMINI_API_KEY，這個 PR 沒有經過 LLM 審查。"
          echo "### ⚠️ 這個 PR 沒有經過 Gemini 審查" >> "$GITHUB_STEP_SUMMARY"
          echo "未設定 \`GEMINI_API_KEY\`。合併前請自行判斷是否需要人工加強審查。" >> "$GITHUB_STEP_SUMMARY"

      # 版本釘死，不用 @v0。浮動 tag 會讓 CI 在跟這次修改無關的 PR 上突然壞掉。
      - uses: google-github-actions/run-gemini-cli@v0.1.22
        if: env.HAS_KEY == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # issue_comment 觸發時 GitHub 當成 issue，PR number 要明講。
          github_pr_number: ${{ github.event.pull_request.number }}
          # 模型需要「能張貼 review」的工具，否則審完的結果會直接丟掉
          # ——第一次實跑就是這樣，workflow 綠但 PR 上什麼都沒有。
          # 走官方的 github-mcp-server，只開三個必要的工具。
          settings: |-
            {
              "model": { "maxSessionTurns": 25 },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run", "-i", "--rm",
                    "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              },
              "tools": { "core": ["list_directory", "read_file", "grep_search"] }
            }
          prompt: |-
            你在審查 GuildHub-frontend 的一個 Pull Request。用繁體中文回覆。

            **先用 `pull_request_read` 取得這個 PR 的 diff 與檔案清單，
            最後用 `pull_request_review_write` 把結果張貼成一則 review。
            只分析而不張貼等於沒有審。**

            先讀 `AGENTS.md` 與 `CONTEXT.md`，那是這個專案的規範與詞彙。
            規格在 `openspec/changes/<change>/`，系統現況在 `openspec/specs/`。

            **這個專案的假想敵是「AI agent 會做沒被要求的事、會宣稱做完但沒做完」。**
            三個人都用 AI coding agent 寫程式。請針對這個失效模式審查，
            不要花時間在風格與命名偏好上。

            **先判斷這是哪一階段的 PR**（看 diff 的檔案路徑），只用對應的 rubric：

            - **規格階段**（只動 `openspec/`）：只檢查下面第 4 項，
              以及規格本身的可測試性。**不要評論不存在的實作。**
            - **實作階段**（動了 `src/` 等）：檢查全部六項。

            依序檢查，每一項給出「有／沒有／不適用」加證據：

            1. **範圍蔓延**：有沒有 `specs` 沒寫、但這個 PR 做了的東西？
               列出具體檔案與行號。

            2. **規格被實作反向修改**：這個 PR 有沒有同時改 `specs` 又改實作？
               如果有，規格的改動是「發現規格有問題」還是「把規格調整成已經寫出來的樣子」？

            3. **Scenario 沒有對應測試**：把 `specs` 裡每個 `#### Scenario:` 列出來，
               標出哪些找不到對應的測試。**這是這個專案最常見的破口。**

            4. **失敗路徑**：新增的 Requirement 有沒有涵蓋錯誤情境
               （輸入不合法、權限不足、資源不存在、超過上限）？

            5. **無證據的完成宣稱**：PR 描述裡有沒有「已完成／測試通過」
               但沒有貼實際指令輸出？

            6. **高頻資料進了 React**：有沒有 position / rotation / 動畫相位
               被寫進 React state 或 Zustand？（`CONTEXT.md` 明訂禁止，
               違反時不會有錯誤訊息，只會變慢）

            ## 輸出格式

            分成兩段，**嚴重度低的不要放在前面**：

            1. **合併前必須處理** —— 只放你有具體證據（檔案 + 行號）的項目。
               沒有就寫「沒有」。
            2. **其他觀察** —— 收在 `<details>` 摺疊區。

            **不要因為找不到問題就編一個出來。** 空的第一段是好結果，不是失職。
            風格與命名偏好不要寫，那些交給 lint。

# 為什麼永遠是 advisory
#
# LLM 的審查結果是非決定性的。**低誤報率不會變成決定性** ——
# 不該因為跑一陣子看似穩定，就讓模型判決直接掌握合併權。
# 這一關不會被加進 ruleset 的 required checks。
#
# 「審完沒問題再合併」是靠流程順序達成的：意見留在 PR 上，
# 人讀完再按合併。決定權在人，機器只負責把該看的攤在面前。
#
# 真正該擋的東西用決定性的檢查擋（見 ci.yml 的 Phase 與 Spec 兩關）。
