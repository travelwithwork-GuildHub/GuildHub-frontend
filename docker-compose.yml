# 可拋棄的資料庫（規格 FE-O04）。只有 Postgres —— 前端的 Route Handlers 用 `npm run dev` 起，不進容器。
#
#   docker compose up -d
#   INTERNAL_DATABASE_URL=postgresql://guildhub:guildhub@localhost:5432/guildhub_frontend
#   INTERNAL_TEST_DATABASE_URL=postgresql://guildhub:guildhub@localhost:5432/guildhub_frontend_test
#
# CI 不用這個檔案（service container）；本機也可以用 Homebrew 的 Postgres（db/schema/README.md）。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guildhub
      POSTGRES_PASSWORD: guildhub
      POSTGRES_DB: guildhub_frontend
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
